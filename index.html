<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Persönliches Gebet in der russisch-orthodoxen Tradition." />
    <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1815" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS ignoriert SVG als Touch-Icon; hier ein PNG für den Home-Bildschirm. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- Schriften liegen lokal in /fonts, siehe src/styles/fonts.css. -->
    <title>Gebet</title>
    <script>
      // Setzt das Theme vor dem ersten Zeichnen, damit die App nicht hell
      // aufblitzt, bevor React die Einstellung aus IndexedDB gelesen hat.
      document.documentElement.dataset.theme = window.matchMedia(
        '(prefers-color-scheme: dark)',
      ).matches
        ? 'dark'
        : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
